<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bole Weather</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app-container">

    <header class="brand-header">

      <div class="brand-logo" aria-hidden="true">

        <span class="sun"></span>
        <span class="cloud"></span>

      </div>

      <div>

        <div class="brand-name">
          Bole Weather
        </div>

        <div class="brand-tagline">
          Weather across Ethiopia
        </div>

      </div>

    </header>

    <header class="search-section">

      <div class="input-group">

        <input
          type="text"
          id="city-input"
          placeholder="Search an Ethiopian city..."
          autocomplete="off"
          aria-label="Search Ethiopian city"
        >

        <button
          id="search-btn"
          type="button"
        >
          Search
        </button>


        <div
          id="suggestions-list"
          class="suggestions-list hidden"
        ></div>

      </div>


      <button
        id="fav-btn"
        class="fav-action-btn"
        type="button"
      >
        ★ Save to Favorites
      </button>

    </header>


    <section class="favorites-section">

      <button
        id="favorites-toggle"
        class="favorites-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="favorites-list"
      >

        <span>
          ★ Favorites
        </span>

        <span
          id="favorites-count"
          class="favorites-count"
        >
          0
        </span>

        <span class="favorites-chevron">
          ⌄
        </span>

      </button>


      <div
        id="favorites-list"
        class="favorites-list hidden"
      >
  

      </div>

    </section>

    <div
      id="alert-banner"
      class="alert-banner hidden"
    >

      <span class="alert-icon">
        ⚠️
      </span>

      <p id="alert-text">
        Heavy rainfall advisory in effect.
      </p>

    </div>

    <section class="current-weather">

      <h1 id="city-name">
        Addis Ababa
      </h1>


      <div class="temp-wrapper">

        <img
          id="weather-icon"
          src="icons/sunny.svg"
          alt="Weather Icon"
        >

        <span
          id="temperature"
          class="temp-display"
        >
          --°C
        </span>

      </div>


      <p
        id="weather-desc"
        class="condition"
      >
        Loading weather...
      </p>

      <div class="weather-details">



        <div class="weather-detail">

          <img
            src="icons/humidity.svg"
            class="detail-icon"
            alt="Humidity"
          >

          <div class="detail-info">

            <span class="detail-label">
              Humidity
            </span>

            <strong id="humidity">
              --%
            </strong>

          </div>

        </div>


      

        <div class="weather-detail">

          <img
            src="icons/wind.svg"
            class="detail-icon"
            alt="Wind"
          >

          <div class="detail-info">

            <span class="detail-label">
              Wind
            </span>

            <strong id="wind-speed">
              -- km/h
            </strong>

          </div>

        </div>


      </div>

    </section>

    <section class="forecast-section">

      <h3>
        3-Day Forecast
      </h3>

      <div
        id="forecast-container"
        class="forecast-grid"
      >
      </div>

    </section>


  </main>


  <script src="script.js"></script>

</body>
</html>
